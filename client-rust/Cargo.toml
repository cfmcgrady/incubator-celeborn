[package]
name = "celeborn-client"
version = "0.1.0"
edition = "2021"
authors = ["Apache Celeborn Contributors"]
license = "Apache-2.0"
description = "Rust client for Apache Celeborn - A distributed shuffle service"
repository = "https://github.com/apache/incubator-celeborn"
keywords = ["celeborn", "shuffle", "distributed", "spark", "flink"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Networking
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"

# Protobuf
prost = "0.12"
prost-types = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4"] }
dashmap = "5.5"
parking_lot = "0.12"
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Configuration
config = "0.14"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "push_data"
harness = false

[features]
default = []
compression-lz4 = []
compression-zstd = []
