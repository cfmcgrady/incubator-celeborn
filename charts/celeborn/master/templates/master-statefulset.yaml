apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-master
  labels:
    app.kubernetes.io/role: master
    {{- include "celeborn.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "celeborn.masterSelectorLabels" . | nindent 6 }}
  serviceName: {{ .Release.Name }}-master
  replicas: {{ .Values.masterReplicas }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: {{ .Values.partition.master | default 0 }}  # 初始值为总 Pod 数量
  template:
    metadata:
      annotations:
        prometheus.io/path: "/metrics/prometheus"
        prometheus.io/port: "{{ (index .Values.portMapping (toString .Values.service.port)).metrics_master }}"
        prometheus.io/scrape: "true"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "celeborn.masterSelectorLabels" . | nindent 8 }}
        {{- toYaml .Values.podExtraLabels | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.releaseVersion | quote }}
        app.kubernetes.io/tag: {{ .Values.image.master.tag | quote }}
        clusterName: {{ .Values.clusterName | quote }}
        masterCluster: {{ .Values.clusterName | quote }}
        version: {{ .Values.releaseVersion | quote }}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: "kubernetes.io/hostname"
              labelSelector:
                matchLabels:
                  app.kubernetes.io/role: master
                  app.kubernetes.io/port: {{ toString .Values.service.port | quote }}
      {{- with .Values.nodeSelector.master }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations.master }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.priorityClass.master.name .Values.priorityClass.master.create }}
      priorityClassName: {{ .Values.priorityClass.master.name | default (printf "%s-master-priority" (.Release.Name)) }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.network.master.hostNetwork }}
      dnsPolicy: {{ .Values.network.master.dnsPolicy }}
      restartPolicy: Always
      initContainers:
      - name: chown-{{ $.Release.Name }}-master-volume
        image: "{{ .Values.image.repository }}:{{ .Values.image.master.tag }}"
        imagePullPolicy: {{ "Always" }}
        securityContext:
          runAsUser: 0
        command:
          - chown
          - {{ .Values.securityContext.runAsUser | default 10006 }}:{{ .Values.securityContext.runAsGroup | default 10006 }}
          - /data/celeborn
        resources:
          {{- toYaml .Values.resources.master | nindent 12 }}
        volumeMounts:
          - name: celeborn-master
            mountPath: /data/celeborn
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.master.tag }}"
        imagePullPolicy: {{ .Values.image.master.pullPolicy }}
        command:
          - "/usr/bin/tini"
          - "--"
          - "/bin/sh"
          - '-c'
          - "exec /opt/celeborn/sbin/start-master.sh"
        resources:
          {{- toYaml .Values.resources.master | nindent 12 }}
        volumeMounts:
          - mountPath: /opt/celeborn/conf
            name: {{ include "celeborn.fullname" . }}-volume
            readOnly: true
          - name: celeborn-master
            mountPath: /data/celeborn
        env:
          {{- range $key, $val := .Values.environments }}
          - name: {{ $key }}
            value: {{ $val | quote }}
          {{- end}}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            name: {{ .Release.Name }}-conf
          name: {{ include "celeborn.fullname" . }}-volume
  volumeClaimTemplates:
  - metadata:
      name: celeborn-master
    spec:
      {{- toYaml .Values.pvc.master | nindent 6 }}

